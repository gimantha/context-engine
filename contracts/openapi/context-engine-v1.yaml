openapi: 3.1.0
info:
  title: Context Engine API
  version: 0.2.0
  description: Provider-neutral API draft for governed context spaces.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /spaces:
    get:
      operationId: listContextSpaces
      responses:
        "200":
          description: Visible context spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContextSpace"
    post:
      operationId: createContextSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContextSpace"
      responses:
        "201":
          description: Context space created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSpace"
        "400":
          $ref: "#/components/responses/Error"
  /spaces/{spaceId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      operationId: getContextSpace
      responses:
        "200":
          description: Visible context space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSpace"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateContextSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContextSpace"
      responses:
        "200":
          description: Updated context space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSpace"
    delete:
      operationId: deleteContextSpace
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
  /spaces/{spaceId}/sources:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      operationId: listSources
      responses:
        "200":
          description: Registered sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
    post:
      operationId: registerSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSource"
      responses:
        "201":
          description: Source registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
  /sources/{sourceId}/checkpoints:
    get:
      operationId: getSourceCheckpoint
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Current source checkpoint
          content:
            application/json:
              schema:
                type: object
                required: [sourceId, cursor, updatedAt]
                properties:
                  sourceId:
                    $ref: "#/components/schemas/Identifier"
                  cursor:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
  /ingestions:
    post:
      operationId: acceptIngestion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/ingestion-event.schema.json"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /uploads:
    post:
      operationId: createUpload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
  /queries:
    post:
      operationId: createQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Completed query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "202":
          $ref: "#/components/responses/JobAccepted"
  /queries/{queryId}:
    get:
      operationId: getQuery
      parameters:
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
  /queries/{queryId}/evidence:
    get:
      operationId: listQueryEvidence
      parameters:
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200":
          description: Currently authorized evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
  /queries/{queryId}/trace:
    get:
      operationId: getQueryTrace
      parameters:
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200":
          description: Caller-safe query explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryTrace"
  /evidence/{evidenceId}:
    get:
      operationId: getEvidence
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: Currently authorized evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404":
          $ref: "#/components/responses/Error"
  /spaces/{spaceId}/enrichments:
    post:
      operationId: createContextEnrichment
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
  /records/{recordId}:
    delete:
      operationId: deleteRecord
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
  /auth/permissions:
    get:
      operationId: listEffectivePermissions
      parameters:
        - name: resourceId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: Effective engine actions
          content:
            application/json:
              schema:
                type: object
                required: [resourceId, actions]
                properties:
                  resourceId:
                    $ref: "#/components/schemas/Identifier"
                  actions:
                    type: array
                    items:
                      type: string
  /resources/{resourceId}/grants:
    get:
      operationId: listGrants
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Visible grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
  /resources/{resourceId}/grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - name: grantId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    put:
      operationId: putGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Grant"
      responses:
        "200":
          description: Grant stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
    delete:
      operationId: deleteGrant
      responses:
        "204":
          description: Grant removed
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "503":
          $ref: "#/components/responses/Health"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    QueryId:
      name: queryId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    Error:
      description: Stable engine error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    JobAccepted:
      description: Asynchronous work accepted
      headers:
        Location:
          schema:
            type: string
          description: Job status URL
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobAccepted"
    Health:
      description: Service health
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [ok, unavailable]
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 200
    ContextSpace:
      type: object
      additionalProperties: false
      required: [id, name, state, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        state:
          type: string
          enum: [provisioning, ready, failed, deleting]
        createdAt:
          type: string
          format: date-time
    CreateContextSpace:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
    Source:
      type: object
      additionalProperties: false
      required: [id, spaceId, name, type, state]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        spaceId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
        type:
          type: string
        state:
          type: string
          enum: [ready, paused, failed]
    RegisterSource:
      type: object
      additionalProperties: false
      required: [name, type, audienceMapping]
      properties:
        name:
          type: string
        type:
          type: string
        audienceMapping:
          type: object
          additionalProperties:
            type: string
    JobAccepted:
      type: object
      additionalProperties: false
      required: [jobId, statusUrl]
      properties:
        jobId:
          $ref: "#/components/schemas/Identifier"
        statusUrl:
          type: string
    Job:
      type: object
      additionalProperties: false
      required: [id, state, operation, traceId, attemptCount, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        operation:
          type: string
          enum: [ingestion, update, deletion, enrichment, space_deletion]
        traceId:
          $ref: "#/components/schemas/Identifier"
        attemptCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/Error"
    QueryRequest:
      type: object
      additionalProperties: false
      required: [spaceId, question, mode]
      properties:
        spaceId:
          $ref: "#/components/schemas/Identifier"
        question:
          type: string
          minLength: 1
          maxLength: 10000
        mode:
          type: string
          enum: [context, answer]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    QueryResponse:
      type: object
      additionalProperties: false
      required: [queryId, state, evidence, insufficientEvidence, traceId]
      properties:
        queryId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum: [completed, insufficient_evidence]
        answer:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        insufficientEvidence:
          type: boolean
        traceId:
          $ref: "#/components/schemas/Identifier"
    Evidence:
      type: object
      additionalProperties: false
      required: [id, recordId, sourceId, sourceVersion, passage]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        recordId:
          $ref: "#/components/schemas/Identifier"
        sourceId:
          $ref: "#/components/schemas/Identifier"
        sourceVersion:
          type: string
        passage:
          type: string
        location:
          type: string
        sourceUrl:
          type: string
          format: uri
    QueryTrace:
      type: object
      additionalProperties: false
      required: [traceId, queryId, selectedEvidenceIds, outcome]
      properties:
        traceId:
          $ref: "#/components/schemas/Identifier"
        queryId:
          $ref: "#/components/schemas/Identifier"
        selectedEvidenceIds:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
        outcome:
          type: string
          enum: [answered, insufficient_evidence, denied]
    Grant:
      type: object
      additionalProperties: false
      required: [id, principalId, resourceId, actions]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        principalId:
          $ref: "#/components/schemas/Identifier"
        resourceId:
          $ref: "#/components/schemas/Identifier"
        actions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          $ref: "#/components/schemas/Identifier"
