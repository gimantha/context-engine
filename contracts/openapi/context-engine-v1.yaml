openapi: 3.1.0
info:
  title: Context Engine API
  version: 0.5.0
  description: Provider-neutral API draft for governed context spaces.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /spaces:
    get:
      operationId: listContextSpaces
      responses:
        "200":
          description: Visible context spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContextSpace"
    post:
      operationId: createContextSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContextSpace"
      responses:
        "201":
          description: Context space created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSpace"
        "400":
          $ref: "#/components/responses/Error"
  /spaces/{spaceId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      operationId: getContextSpace
      responses:
        "200":
          description: Visible context space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSpace"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateContextSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContextSpace"
      responses:
        "200":
          description: Updated context space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSpace"
    delete:
      operationId: deleteContextSpace
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
  /spaces/{spaceId}/sources:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      operationId: listSources
      responses:
        "200":
          description: Registered sources in a visible space
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: registerSource
      description: Requires source.manage or space.manage on the space.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSource"
      responses:
        "201":
          description: Source registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getSource
      responses:
        "200":
          description: Visible source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSource
      description: Rename, pause or resume, or remap a source; requires source.manage or space.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSource"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /sources/{sourceId}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getSourceCheckpoint
      responses:
        "200":
          description: Current connector cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkpoint"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putSourceCheckpoint
      description: Store the connector cursor; requires ingest.write on the source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cursor]
              properties:
                cursor:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        "200":
          description: Stored connector cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkpoint"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /sources/{sourceId}/uploads:
    post:
      operationId: stageUpload
      description: >-
        Stage content bytes for a later ingestion event. The response uploadId becomes the
        event's contentRef and its contentHash and contentType must match. Requires
        ingest.write on the source.
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Content staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /sources/{sourceId}/records/{recordId}:
    get:
      operationId: getRecordStatus
      description: Record lifecycle without content, audiences, or backend details.
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "200":
          description: Current record state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordStatus"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /sources/{sourceId}/jobs:
    get:
      operationId: listSourceJobs
      description: Deliveries for a source, for dead-letter inspection; requires delivery or management rights.
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [queued, running, succeeded, failed]
      responses:
        "200":
          description: Jobs newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /sources/{sourceId}/sync-runs:
    post:
      operationId: openSyncRun
      description: >-
        Mark the source as being read by its connector. An unfinished earlier run is
        superseded. Processing progress is measured from the latest run's start. Requires
        ingest.write on the source.
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "201":
          description: Sync run opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRun"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /sources/{sourceId}/sync-runs/{runId}/complete:
    post:
      operationId: completeSyncRun
      description: >-
        Mark the run's reading as completed. Repeating the call is harmless; a superseded run
        answers with a conflict. Requires ingest.write on the source.
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - name: runId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: Sync run with reading completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRun"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /progress/sources/{sourceId}:
    get:
      operationId: getSourceProgress
      description: >-
        Read-only pipeline progress of one source. Requires ingest.write, source.manage, or
        space.manage on the source, because the counts reveal record volume across every
        audience.
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceProgress"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /progress/spaces/{spaceId}:
    get:
      operationId: getSpaceProgress
      description: Progress of the sources in a visible space that the caller may inspect.
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Space progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceProgress"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /ingestions:
    post:
      operationId: acceptIngestion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/ingestion-event.schema.json"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
  /queries:
    post:
      operationId: createQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Completed query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "202":
          $ref: "#/components/responses/JobAccepted"
  /queries/{queryId}:
    get:
      operationId: getQuery
      parameters:
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
  /queries/{queryId}/evidence:
    get:
      operationId: listQueryEvidence
      parameters:
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200":
          description: Currently authorized evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
  /queries/{queryId}/trace:
    get:
      operationId: getQueryTrace
      parameters:
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200":
          description: Caller-safe query explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryTrace"
  /evidence/{evidenceId}:
    get:
      operationId: getEvidence
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: Currently authorized evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404":
          $ref: "#/components/responses/Error"
  /spaces/{spaceId}/enrichments:
    post:
      operationId: createContextEnrichment
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
  /records/{recordId}:
    delete:
      operationId: deleteRecord
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
  /auth/me:
    get:
      operationId: getCurrentPrincipal
      description: The calling principal as the engine resolved it from the credential.
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Error"
  /auth/permissions:
    get:
      operationId: listEffectivePermissions
      parameters:
        - name: resourceId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: Effective engine actions of the caller on a visible resource
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resourceId, actions]
                properties:
                  resourceId:
                    $ref: "#/components/schemas/Identifier"
                  actions:
                    type: array
                    uniqueItems: true
                    items:
                      $ref: "#/components/schemas/Action"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /resources/{resourceId}/grants:
    get:
      operationId: listGrants
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Grants on the resource; requires access.manage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /resources/{resourceId}/grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$"
    put:
      operationId: putGrant
      description: >-
        Create or replace a grant. The acting principal comes from the credential; the body
        names only the grant target and actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutGrant"
      responses:
        "200":
          description: Grant stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteGrant
      responses:
        "204":
          description: Grant removed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "503":
          $ref: "#/components/responses/Health"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    QueryId:
      name: queryId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    Error:
      description: Stable engine error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    JobAccepted:
      description: Asynchronous work accepted
      headers:
        Location:
          schema:
            type: string
          description: Job status URL
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobAccepted"
    Health:
      description: Service health
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [ok, unavailable]
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 200
    ContextSpace:
      type: object
      additionalProperties: false
      required: [id, name, state, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        state:
          type: string
          enum: [provisioning, ready, failed, deleting]
        createdAt:
          type: string
          format: date-time
    CreateContextSpace:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
    Source:
      type: object
      additionalProperties: false
      required: [id, spaceId, name, type, state, versionOrdering, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        spaceId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          minLength: 1
          maxLength: 60
        state:
          type: string
          enum: [ready, paused, failed]
        versionOrdering:
          $ref: "#/components/schemas/VersionOrdering"
        createdAt:
          type: string
          format: date-time
    VersionOrdering:
      type: string
      description: How this source's version strings compare; numeric versions must parse as integers.
      enum: [numeric, lexicographic]
    AudienceMapping:
      type: object
      description: >-
        Trusted source audience tags mapped to engine audiences. Records carrying an unmapped
        tag are quarantined. Write-only; never returned.
      maxProperties: 500
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 300
    RegisterSource:
      type: object
      additionalProperties: false
      required: [name, type, audienceMapping]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          minLength: 1
          maxLength: 60
        audienceMapping:
          $ref: "#/components/schemas/AudienceMapping"
        versionOrdering:
          $ref: "#/components/schemas/VersionOrdering"
    UpdateSource:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        state:
          type: string
          enum: [ready, paused]
        audienceMapping:
          $ref: "#/components/schemas/AudienceMapping"
    Checkpoint:
      type: object
      additionalProperties: false
      required: [sourceId, cursor, updatedAt]
      properties:
        sourceId:
          $ref: "#/components/schemas/Identifier"
        cursor:
          type: string
        updatedAt:
          type: string
          format: date-time
    Upload:
      type: object
      additionalProperties: false
      required: [uploadId, sourceId, contentType, sizeBytes, contentHash, expiresAt]
      properties:
        uploadId:
          $ref: "#/components/schemas/Identifier"
        sourceId:
          $ref: "#/components/schemas/Identifier"
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        contentHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        expiresAt:
          type: string
          format: date-time
    RecordStatus:
      type: object
      additionalProperties: false
      required: [spaceId, sourceId, recordId, state, currentVersion, sourceAclVersion, updatedAt]
      properties:
        spaceId:
          $ref: "#/components/schemas/Identifier"
        sourceId:
          $ref: "#/components/schemas/Identifier"
        recordId:
          type: string
        state:
          type: string
          enum: [active, deleted, quarantined]
        currentVersion:
          type: string
        sourceAclVersion:
          type: string
        contentHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        quarantineReason:
          type: string
        updatedAt:
          type: string
          format: date-time
    JobAccepted:
      type: object
      additionalProperties: false
      required: [jobId, statusUrl]
      properties:
        jobId:
          $ref: "#/components/schemas/Identifier"
        statusUrl:
          type: string
    Job:
      type: object
      additionalProperties: false
      required: [id, state, operation, traceId, attemptCount, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        operation:
          type: string
          enum: [ingestion, update, deletion, enrichment, space_deletion]
        traceId:
          $ref: "#/components/schemas/Identifier"
        attemptCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/Error"
    QueryRequest:
      type: object
      additionalProperties: false
      required: [spaceId, question, mode]
      properties:
        spaceId:
          $ref: "#/components/schemas/Identifier"
        question:
          type: string
          minLength: 1
          maxLength: 10000
        mode:
          type: string
          enum: [context, answer]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    QueryResponse:
      type: object
      additionalProperties: false
      required: [queryId, state, evidence, insufficientEvidence, traceId]
      properties:
        queryId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum: [completed, insufficient_evidence]
        answer:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        insufficientEvidence:
          type: boolean
        traceId:
          $ref: "#/components/schemas/Identifier"
    Evidence:
      type: object
      additionalProperties: false
      required: [id, recordId, sourceId, sourceVersion, passage]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        recordId:
          $ref: "#/components/schemas/Identifier"
        sourceId:
          $ref: "#/components/schemas/Identifier"
        sourceVersion:
          type: string
        passage:
          type: string
        location:
          type: string
        sourceUrl:
          type: string
          format: uri
    QueryTrace:
      type: object
      additionalProperties: false
      required: [traceId, queryId, selectedEvidenceIds, outcome]
      properties:
        traceId:
          $ref: "#/components/schemas/Identifier"
        queryId:
          $ref: "#/components/schemas/Identifier"
        selectedEvidenceIds:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
        outcome:
          type: string
          enum: [answered, insufficient_evidence, denied]
    Action:
      type: string
      enum:
        - space.manage
        - source.manage
        - ingest.write
        - context.read
        - evidence.read
        - trace.read
        - context.enrich
        - record.delete
        - access.manage
    Principal:
      type: object
      additionalProperties: false
      required: [id, kind, groups]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        kind:
          type: string
          enum: [user, service]
        email:
          type: string
          maxLength: 320
        groups:
          type: array
          uniqueItems: true
          items:
            type: string
    PutGrant:
      type: object
      additionalProperties: false
      required: [actions]
      oneOf:
        - required: [principalId]
        - required: [group]
      properties:
        principalId:
          $ref: "#/components/schemas/Identifier"
        group:
          type: string
          minLength: 1
          maxLength: 300
        actions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Action"
    Grant:
      type: object
      additionalProperties: false
      required: [id, resourceId, actions]
      oneOf:
        - required: [principalId]
        - required: [group]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$"
        resourceId:
          $ref: "#/components/schemas/Identifier"
        principalId:
          $ref: "#/components/schemas/Identifier"
        group:
          type: string
          minLength: 1
          maxLength: 300
        actions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Action"
    SyncRun:
      type: object
      additionalProperties: false
      required: [id, sourceId, state, startedAt]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        sourceId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum: [reading, completed, superseded]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    Percent:
      type: [number, "null"]
      minimum: 0
      maximum: 100
    Count:
      type: integer
      minimum: 0
    OptionalCount:
      type: [integer, "null"]
      minimum: 0
    SourceProgress:
      type: object
      additionalProperties: false
      required: [sourceId, reading, processing, records, indexing]
      properties:
        sourceId:
          $ref: "#/components/schemas/Identifier"
        reading:
          type: object
          description: Whether the connector is still reading. No percentage by design.
          additionalProperties: false
          required: [state]
          properties:
            state:
              type: string
              enum: [idle, reading, completed]
            runId:
              type: [string, "null"]
            startedAt:
              type: [string, "null"]
              format: date-time
            completedAt:
              type: [string, "null"]
              format: date-time
        processing:
          type: object
          description: >-
            Delivered events the engine has finished applying since the latest run started.
            Percent is finished (succeeded plus failed) over total.
          additionalProperties: false
          required: [total, queued, running, succeeded, failed]
          properties:
            since:
              type: [string, "null"]
              format: date-time
            total:
              $ref: "#/components/schemas/Count"
            queued:
              $ref: "#/components/schemas/Count"
            running:
              $ref: "#/components/schemas/Count"
            succeeded:
              $ref: "#/components/schemas/Count"
            failed:
              $ref: "#/components/schemas/Count"
            percent:
              $ref: "#/components/schemas/Percent"
        records:
          type: object
          additionalProperties: false
          required: [active, quarantined, deleted]
          properties:
            active:
              $ref: "#/components/schemas/Count"
            quarantined:
              $ref: "#/components/schemas/Count"
            deleted:
              $ref: "#/components/schemas/Count"
        indexing:
          type: object
          description: >-
            Active record versions the knowledge backend has indexed, from the last background
            collection. Percent is indexed over expected.
          additionalProperties: false
          required: [state]
          properties:
            state:
              type: string
              enum: [not_collected, ok, unavailable]
            expected:
              $ref: "#/components/schemas/OptionalCount"
            indexed:
              $ref: "#/components/schemas/OptionalCount"
            indexing:
              $ref: "#/components/schemas/OptionalCount"
            failed:
              $ref: "#/components/schemas/OptionalCount"
            missing:
              $ref: "#/components/schemas/OptionalCount"
            percent:
              $ref: "#/components/schemas/Percent"
            collectedAt:
              type: [string, "null"]
              format: date-time
    SpaceProgress:
      type: object
      additionalProperties: false
      required: [spaceId, sources]
      properties:
        spaceId:
          $ref: "#/components/schemas/Identifier"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceProgress"
    Error:
      type: object
      additionalProperties: false
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          $ref: "#/components/schemas/Identifier"
